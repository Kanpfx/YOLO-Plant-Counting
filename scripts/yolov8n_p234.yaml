nc: 3

backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [16, 3, 2]]      # 0 P1/2
  - [-1, 1, Conv, [32, 3, 2]]      # 1 P2/4
  - [-1, 1, C2f, [32, True]]       # 2 P2 output

  - [-1, 1, Conv, [64, 3, 2]]      # 3 P3/8
  - [-1, 2, C2f, [64, True]]       # 4 P3 output

  - [-1, 1, Conv, [128, 3, 2]]     # 5 P4/16
  - [-1, 2, C2f, [128, True]]      # 6 P4 output
  - [-1, 1, SPPF, [128, 5]]        # 7 P4 SPPF output

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 1, C2f, [64]]             # 10 (P3 feature)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]      # cat backbone P2
  - [-1, 1, C2f, [32]]             # 13 (P2 feature)

  - [-1, 1, Conv, [32, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]             # 16 (P3 feature)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]            # 19 (P4 feature)

  - [[13, 16, 19], 1, Detect, [nc]]